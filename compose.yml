# Solo la base de datos. Rails y Vite corren en tu Mac (scripts del template).
#   docker compose up -d      -> levanta Postgres
#   docker compose down       -> lo apaga (conserva datos)
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reservaya_development
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reservaya_development"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres:
