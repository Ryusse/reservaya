# PostgreSQL. Corre en Docker (compose.yml); Rails se conecta por localhost.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "user") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>

development:
  <<: *default
  database: reservaya_development

test:
  <<: *default
  database: reservaya_test

production:
  primary:
    <<: *default
    database: reservaya_production
    username: <%= ENV.fetch("DATABASE_USER", "app") %>
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: reservaya_production_cache
    username: <%= ENV.fetch("DATABASE_USER", "app") %>
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: reservaya_production_queue
    username: <%= ENV.fetch("DATABASE_USER", "app") %>
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: reservaya_production_cable
    username: <%= ENV.fetch("DATABASE_USER", "app") %>
    password: <%= ENV["APP_DATABASE_PASSWORD"] %>
    migrations_paths: db/cable_migrate
